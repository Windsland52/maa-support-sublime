name: Release LSP-MaaFramework

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: npm install --global pnpm@10.31.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm lint
      - run: pnpm release:sublime
      - name: Review Sublime package
        run: |
          mkdir -p build/package-review
          uv run --frozen python -m zipfile -e release/LSP-MaaFramework.sublime-package build/package-review
          uv run --frozen python -m st_package_reviewer --fail-on-warnings build/package-review
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/LSP-MaaFramework.sublime-package --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/LSP-MaaFramework.sublime-package --generate-notes
          fi
