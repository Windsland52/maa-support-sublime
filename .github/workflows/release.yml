name: Release LSP-MaaFramework

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.8'
      - run: npm install --global pnpm@10.31.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm release:sublime
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/LSP-MaaFramework.sublime-package --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/LSP-MaaFramework.sublime-package --generate-notes
          fi
