name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: npm install --global pnpm@10.31.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package:sublime
      - name: Review Sublime package
        run: |
          mkdir -p build/package-review
          uv run --frozen python -m zipfile -e release/LSP-MaaFramework.sublime-package build/package-review
          uv run --frozen python -m st_package_reviewer --fail-on-warnings build/package-review
