name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.8'
      - run: npm install --global pnpm@10.31.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package:sublime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install st-package-reviewer
      - name: Review Sublime package
        run: |
          mkdir -p build/package-review
          python -m zipfile -e release/LSP-MaaFramework.sublime-package build/package-review
          python -m st_package_reviewer --fail-on-warnings build/package-review
